
name: Build Krokiet Classic for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_classic_gui.py'
      - '.github/workflows/build-krokiet-classic.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out wrapper repository
        uses: actions/checkout@v4

      - name: Clone upstream Czkawka
        shell: pwsh
        run: git clone --depth 1 https://github.com/qarmin/czkawka.git czkawka

      - name: Apply checkpoint backend
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v21.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v21.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply checkpoint diagnostics patch
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v22-diagnostics.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v22-diagnostics.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.3 cache metrics
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v23-diagnostics.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v23-diagnostics.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.4A SQLite verification
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v24a-sqlite-verification.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v24a-sqlite-verification.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.4B live scan timers
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v24b-live-timers.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v24b-live-timers.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.4C diagnostics panel
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v24c-diagnostics-panel.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v24c-diagnostics-panel.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          
      - name: Apply v2.4D stable stage timing
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v24d-stage-timing.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v24d-stage-timing.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.5A scan workspace
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v25-scan-workspace.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v25-scan-workspace.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply v2.5B scan monitor layout
        shell: pwsh
        run: |
          git -C czkawka apply --check ../backend-v25b-monitor-layout.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C czkawka apply ../backend-v25b-monitor-layout.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test checkpoint storage
        shell: pwsh
        working-directory: czkawka
        run: cargo test -p czkawka_core checkpoint_cache --lib

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply classic layout
        shell: pwsh
        run: python apply_classic_gui.py czkawka

      - name: Verify modified source
        shell: pwsh
        run: |
          git -C czkawka diff --check
          git -C czkawka diff --stat

      - name: Build Windows executable
        shell: pwsh
        working-directory: czkawka
        run: cargo build --release -p krokiet

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: krokiet-classic-windows
          path: czkawka/target/release/krokiet.exe
          if-no-files-found: error
